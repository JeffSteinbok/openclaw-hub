name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run script tests
        run: npm run test:scripts

      - name: Run TypeScript plugin tests
        run: |
          set -euo pipefail
          failed=0
          for vitest_config in plugins/*/vitest.config.ts; do
            dir="$(dirname "$vitest_config")"
            if [ -f "$dir/package.json" ] && grep -q '"test"' "$dir/package.json"; then
              echo "=== $dir ==="
              (cd "$dir" && npm test) || failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Run service tests
        run: |
          set -euo pipefail
          failed=0
          for vitest_config in services/*/vitest.config.ts; do
            dir="$(dirname "$vitest_config")"
            if [ -f "$dir/package.json" ] && grep -q '"test"' "$dir/package.json"; then
              echo "=== $dir ==="
              (cd "$dir" && npm test) || failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Run library tests
        run: |
          set -euo pipefail
          failed=0
          for vitest_config in libs/ts/*/vitest.config.ts; do
            dir="$(dirname "$vitest_config")"
            if [ -f "$dir/package.json" ] && grep -q '"test"' "$dir/package.json"; then
              echo "=== $dir ==="
              (cd "$dir" && npm test) || failed=1
            fi
          done
          [ "$failed" -eq 0 ]
