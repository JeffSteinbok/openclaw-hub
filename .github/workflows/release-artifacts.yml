name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional release tag (defaults to hub-v<release-manifest hubVersion>)
        required: false
        type: string
      release_title:
        description: Optional release title (defaults to OpenClaw Hub <hubVersion>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Build mirrored plugins
        run: npm run build

      - name: Export release artifacts
        run: npm run export:release

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p out/release-assets
          hub_version="$(jq -r '.hubVersion' release-manifest.json)"
          bundle_root="openclaw-hub-v${hub_version}"
          bundle_asset="$(jq -r '.bundleAsset' release-manifest.json)"
          mkdir -p "out/release-assets/${bundle_root}"
          cp -R out/export/. "out/release-assets/${bundle_root}/"
          tar -C out/release-assets -czf "out/release-assets/${bundle_asset}" "${bundle_root}"
          {
            echo '# OpenClaw Hub bundle'
            echo
            echo "Download \`${bundle_asset}\` for the full exported OpenClaw Hub bundle."
            echo
            echo 'The bundle contains:'
            echo
            jq -r '.includes.services[] | "- service: `" + . + "`"' release-manifest.json
            jq -r '.includes.plugins[] | "- plugin: `" + . + "`"' release-manifest.json
            jq -r '.includes.sharedPython[] | "- shared library: `" + . + "`"' release-manifest.json
          } > out/release-assets/RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hub_version="$(jq -r '.hubVersion' release-manifest.json)"
          tag_name="${{ inputs.tag_name }}"
          release_title="${{ inputs.release_title }}"
          if [ -z "$tag_name" ]; then
            tag_name="hub-v${hub_version}"
          fi
          if [ -z "$release_title" ]; then
            release_title="OpenClaw Hub ${hub_version}"
          fi
          bundle_asset="$(jq -r '.bundleAsset' release-manifest.json)"
          gh release create "$tag_name" "out/release-assets/${bundle_asset}" \
            --title "$release_title" \
            --notes-file out/release-assets/RELEASE_NOTES.md
